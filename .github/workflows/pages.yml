# Publish JARVIS to GitHub Pages.
#
# Pages serves this repo from the `gh-pages` branch (GitHub's built-in branch
# builder picked it up automatically), so this workflow builds the site and
# pushes it there rather than using the Actions Pages deployment API.
name: Publish JARVIS

on:
  push:
    branches: [master, main]
    paths:
      - 'jarvis/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-jarvis
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        working-directory: jarvis
        run: npm test

      - name: Build the standalone file
        working-directory: jarvis
        run: npm run build

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r jarvis/public/. _site/
          cp jarvis/jarvis.html _site/jarvis.html
          touch _site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish JARVIS from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
