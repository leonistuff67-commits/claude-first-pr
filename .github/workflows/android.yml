# Build JARVIS as a real Android app (.apk / .aab).
#
# This wraps the published PWA in a Trusted Web Activity with Bubblewrap, so
# the Android app is the same JARVIS — same code, same offline cache — in a
# native shell with its own icon in the launcher.
#
# Run it from the Actions tab (Run workflow). The APK lands as a build artifact
# you can download and install.
#
# Bubblewrap's CLI is interactive: left to itself it stops to ask whether it
# should download a JDK and an Android SDK. On a runner there is nobody to
# answer, so we install both up front and hand Bubblewrap their paths in
# ~/.bubblewrap/config.json — then it never asks. The remaining prompts are
# field confirmations whose defaults come from the web manifest, so an endless
# stream of blank lines (`yes ''`) accepts them all.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host serving the PWA'
        default: 'leonistuff67-commits.github.io'
      path:
        description: 'Path to the app on that host'
        default: '/claude-first-pr/'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Bubblewrap reaches for a specific build-tools version depending on its
      # own version, so install the ones it is known to ask for rather than
      # guessing a single one.
      - name: Install build tools and platforms
        run: |
          sdkmanager --install \
            'platforms;android-35' 'platforms;android-34' 'platforms;android-33' \
            'build-tools;35.0.0' 'build-tools;34.0.0' 'build-tools;33.0.2'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # This is what keeps the build non-interactive: with both paths known,
      # Bubblewrap skips its "shall I download a JDK / SDK?" questions.
      - name: Point Bubblewrap at the installed JDK and SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      # A debug keystore keeps this reproducible without committing secrets.
      # For a Play Store release you would sign with your own upload key.
      # The path and alias match Bubblewrap's own defaults so the prompts for
      # them can be accepted blank, and so it never offers to create a key.
      - name: Create a signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jarvis123 -keypass jarvis123 \
            -dname "CN=JARVIS, OU=Dev, O=JARVIS, L=., S=., C=US"

      - name: Initialise the TWA project
        run: |
          yes '' | bubblewrap init \
            --manifest "https://${{ inputs.host }}${{ inputs.path }}manifest.webmanifest" \
            --directory twa \
            --chromeosonly false \
            --alphaDependencies false \
            --skipPwaValidation true
          echo '--- twa-manifest.json ---'
          cat twa/twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: jarvis123
          BUBBLEWRAP_KEY_PASSWORD: jarvis123

      - name: Build the APK
        working-directory: twa
        run: yes '' | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: jarvis123
          BUBBLEWRAP_KEY_PASSWORD: jarvis123

      - name: Report the signing fingerprint
        if: always()
        run: |
          echo "Add this SHA-256 to assetlinks.json so the app opens without a URL bar:"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/android.keystore" -alias android \
            -storepass jarvis123 | grep 'SHA256:' || true

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android
          path: |
            twa/*.apk
            twa/*.aab
          if-no-files-found: warn
